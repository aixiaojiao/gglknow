<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GglKnow · 收藏资料库</title><link rel="stylesheet" href="vendor/tabler.min.css"><link rel="stylesheet" href="reader.css"></head>
<body>
<div class="library-shell">
  <aside class="library-sidebar">
    <a class="brand" href="tweet-browser.html">GglKnow</a>
    <label class="btn btn-primary import-folder" for="folderInput"><span aria-hidden="true">＋</span> 导入文件夹</label>
    <input id="folderInput" type="file" webkitdirectory multiple hidden>
    <nav aria-label="资料库"><button class="nav-item active" data-filter="all">全部收藏</button><button class="nav-item" data-filter="images">有图片</button><button class="nav-item" data-filter="threads">推文串</button></nav>
    <div class="section-heading"><span>收藏夹</span><button id="newCollection" class="quiet-btn" aria-label="新建收藏夹">＋</button></div>
    <nav id="collections" aria-label="收藏夹"></nav>
    <div class="sidebar-footer"><p>内容保存在你的设备上</p><button id="exportBackup" class="btn">导出备份</button><button id="importBackup" class="btn">导入备份</button><input type="file" id="backupInput" accept=".json" hidden></div>
  </aside>
  <section class="library-list" aria-label="收藏列表">
    <header class="list-header"><div class="list-title"><h1 id="listTitle">全部收藏</h1><span id="count">0 篇</span></div><input id="search" class="form-control" type="search" placeholder="搜索收藏…" aria-label="搜索收藏"><div class="filter-row"><select id="author" class="form-select" aria-label="作者"><option value="">所有作者</option></select><select id="tagFilter" class="form-select" aria-label="标签"><option value="">所有标签</option></select></div></header>
    <div id="entries" class="entry-list"></div><button id="loadMore" class="btn" hidden>显示更多</button>
    <p id="importStatus" class="import-status" role="status"></p>
  </section>
  <main class="reader-pane" id="readerPane">
    <div class="reader-toolbar" id="readerToolbar" hidden><a id="original" target="_blank" rel="noopener noreferrer">查看原文 ↗</a><button id="exportMarkdown" class="btn">导出 Markdown</button></div>
    <form id="metadataForm" class="metadata-form" hidden><div><label for="tagInput">添加标签</label><input id="tagInput" class="form-control" placeholder="输入标签后按回车"></div><div><label for="collectionSelect">添加到收藏夹</label><select id="collectionSelect" class="form-select"></select></div></form>
    <article id="reading" class="reading"><div class="reader-empty"><div class="empty-mark" aria-hidden="true">G</div><h2>把值得留下的内容<br>变成自己的知识</h2><p>导入你保存的推文文件夹，<br>在这里阅读、搜索和整理。</p><span>支持新旧 HTML、JSON 和本地图片</span></div></article>
  </main>
</div><div id="notification" class="notification" role="status" hidden></div>
<dialog id="collectionDialog"><form method="dialog"><h2>新建收藏夹</h2><input id="collectionName" class="form-control" required maxlength="60" aria-label="收藏夹名称"><div class="dialog-actions"><button value="cancel" class="btn" formnovalidate>取消</button><button value="create" class="btn btn-primary">创建</button></div></form></dialog>
<script src="reader.js"></script>
</body></html>
